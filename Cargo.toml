[package]
name = "hacp"
version = "1.1.1"
edition = "2021"
description = "HACP — Heterogeneous Agent Collaboration Protocol: wire types, validation, and conformance vectors"
license = "Apache-2.0"
repository = "https://github.com/manvendersingh21/hacp"
readme = "README.md"

# This crate is the protocol, not an implementation of a system that uses it.
# It MUST NOT depend on any hive-* crate, on an async runtime, on a database,
# or on an HTTP client. Adding such a dependency is a design error, not a
# convenience: see spec/HACP.md, which names no implementation for the same
# reason.
[dependencies]
serde = { version = "1", features = ["derive"] }
# `arbitrary_precision` (finding V6): the canonical form (spec §5.1) requires
# integers of any magnitude, matching the independent Python peer (arbitrary
# precision `int`) and JSON's own number grammar, which has no integer range
# limit. Without this feature, serde_json falls back to f64 for integers
# outside i64/u64 range, which loses exact digits and made canon::write_number
# refuse them outright — a canonical-form disagreement with the spec and the
# peer. This feature preserves the original decimal text for every number
# (still parsed/compared correctly for in-range integers and floats), so
# `write_number` can render huge integers exactly.
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
schemars = { version = "0.8", features = ["chrono"] }
sha2 = "0.10"
thiserror = "2"

base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"], optional = true }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"], optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }
zeroize = { version = "1", features = ["derive"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
libc = { version = "0.2", optional = true }

[features]
default = []
guardian = ["dep:x25519-dalek", "dep:ed25519-dalek", "dep:chacha20poly1305", "dep:hkdf", "dep:zeroize", "dep:rand_core", "dep:libc"]

[[bin]]
name = "hacp-secure-guardian"
path = "src/bin/hacp-secure-guardian.rs"
required-features = ["guardian"]

[dev-dependencies]
static_assertions = "1"
